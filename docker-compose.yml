services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cricstate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricstate}
      POSTGRES_DB: ${POSTGRES_DB:-cricstate}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cricstate}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cricstate}:${POSTGRES_PASSWORD:-cricstate}@postgres:5432/${POSTGRES_DB:-cricstate}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    env_file:
      - ./web/.env
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin:
    build: ./admin
    restart: unless-stopped
    env_file:
      - ./admin/.env
    ports:
      - "5174:5174"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - web
      - admin

  # streaming:
  #   Implemented in Phase 6. Will run the RTMP/SRT ingest + HLS packaging
  #   service (kept fully separate from `backend`, which only ever stores
  #   stream *metadata*). See streaming/README.md.

volumes:
  postgres_data:
